# Verify + build + deploy to S3/CloudFront (Constitution Article IV —
# static-site purity: the deployable artifact is exactly what `pnpm generate`
# writes to `.output/public`, no server, no compute at request time).
#
# Triggered by:
#   pull_request  — verify only (typecheck, lint, tests, both builds), same
#                   gates as init.sh. Never deploys.
#   workflow_call — the normal deploy path, invoked by create-release.yml
#                   with a tag to check out and ship.
#   workflow_dispatch — manual deploy without a release ceremony, for
#                   recovering from a transient failure.
#
# No `push` trigger. create-release.yml owns push-to-master and calls this
# workflow via workflow_call — if this file also triggered on push, every
# merge would deploy twice: once here, once through the release ceremony.
#
# ## One-time AWS setup required before this can deploy (done, see
# muush-foundation's modules/site-deploy-oidc):
#
# 1. IAM OIDC identity provider for token.actions.githubusercontent.com in
#    the Muush AWS account.
# 2. IAM role trusted by that provider, scoped to this repo's `production`
#    GitHub Environment (the OIDC sub claim becomes
#    "repo:OWNER/REPO:environment:production" for any job that declares
#    `environment: production` — confirmed against a real token after this
#    exact mismatch broke the first deploy attempt).
# 3. Permissions policy on that role: s3:PutObject/DeleteObject/ListBucket
#    on the target bucket, cloudfront:CreateInvalidation on the
#    distribution.
#
# ## Repository configuration (Settings → Secrets and variables → Actions)
#
# Secrets:
#   AWS_DEPLOY_ROLE_ARN            — the IAM role ARN from step 2 above
#
# Variables (not secret — bucket/distribution IDs, not credentials):
#   AWS_REGION                     — e.g. us-east-1
#   AWS_S3_BUCKET                  — target bucket name
#   AWS_CLOUDFRONT_DISTRIBUTION_ID — target distribution ID

name: Deploy

on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      tag:
        description: "Git tag to check out and deploy (e.g. v1.2.0)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional: tag or SHA to deploy (defaults to the branch this was dispatched from)"
        required: false
        type: string

# Never cancel a deploy mid-flight — a cancelled S3 sync can leave the
# bucket in a half-updated state, mismatched cache headers between old and
# new files. PR verify runs are cheap to cancel and re-run on a new push, so
# only those get cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref to check out
        id: ref
        env:
          TAG: ${{ inputs.tag }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
          FALLBACK_REF: ${{ github.ref }}
        run: |
          RESOLVED="${TAG:-${DISPATCH_REF:-$FALLBACK_REF}}"
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Verifying ref: $RESOLVED"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - name: Verify
        uses: ./.github/actions/verify-site

      # A pull_request run only verifies; every other trigger (workflow_call
      # from create-release.yml, or a manual workflow_dispatch) intends to
      # deploy, so its build becomes the artifact the deploy job ships.
      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: .output/public
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to S3 + invalidate CloudFront
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # required to assume the AWS role via OIDC
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: .output/public

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload hashed assets (long-cache, immutable)
        # `_nuxt/`/`_fonts/` filenames are content-hashed by the build — safe
        # to cache forever, a new deploy ships under new filenames.
        run: |
          aws s3 sync .output/public "s3://${{ vars.AWS_S3_BUCKET }}" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" \
            --include "_nuxt/*" \
            --include "_fonts/*"

      - name: Upload HTML/payload/other files (revalidate on every request)
        # Everything else (`*.html`, per-route `_payload.json`, `favicon.svg`,
        # `_i18n/*`) is NOT content-hashed, so a stale cached copy would keep
        # serving the previous deploy's markup/data.
        run: |
          aws s3 sync .output/public "s3://${{ vars.AWS_S3_BUCKET }}" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "_nuxt/*" \
            --exclude "_fonts/*"

      - name: Remove files the current build no longer produces
        # No `--exclude`/`--include` here on purpose: `--delete` combined with
        # a filtered file selection only "sees" the filtered subset, so it
        # would misidentify the other subset's objects as stale and delete
        # them. Running the full, unfiltered sync last — after both scoped
        # uploads above already set the right cache headers — only touches
        # deletions; every file already matches, so nothing re-uploads.
        run: |
          aws s3 sync .output/public "s3://${{ vars.AWS_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
