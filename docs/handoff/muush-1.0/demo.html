<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo · animaciones muush 1.0</title>
<style>
  body{margin:0;background:#050505;color:#F4F4F2;font-family:system-ui,sans-serif}
  section{position:relative;min-height:80vh;display:grid;place-items:center;overflow:hidden}
  section canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  h2{position:relative;z-index:1;font-weight:500;font-size:clamp(28px,5vw,64px);text-align:center;margin:0}
</style></head><body>
<section data-shader="m1-liston.glsl" data-u='{"u_tx":0.5,"u_ty":0.53,"u_trx":0.36,"u_try":0.28,"u_tdark":1,"u_fadeB":0.06}'><h2>Hablamos negocio<br>y código.</h2></section>
<section data-shader="m1-brasa-acero.glsl" data-o="0.45" data-u='{"u_angle":2.35,"u_gap":0.22,"u_soft":0.45,"u_scale":1.3,"u_tdark":0.8,"u_fadeT":0.2,"u_fadeB":0.3}'><h2>Qué es muush</h2></section>
<section data-shader="m1-acanalado.glsl" data-u='{"u_y0":0.52,"u_y1":0.47,"u_th":0.15,"u_right":0.45,"u_ty":0.27,"u_trx":0.42,"u_try":0.22,"u_tdark":0.9,"u_fadeT":0.2,"u_fadeB":0.15}'><h2>Cómo trabajamos</h2></section>
<section data-shader="m1-liston.glsl" data-u='{"u_y0":1.0,"u_y1":0.35,"u_th":0.11,"u_amp":0.06,"u_twist":0.5,"u_tx":0.27,"u_ty":0.45,"u_trx":0.25,"u_try":0.35,"u_tdark":0.75,"u_fadeT":0.3,"u_fadeB":0.05}'><h2>Pide tu diagnóstico</h2></section>
<script type="module">
  import { MuushGradient } from './muush-gradient.js';
  for (const s of document.querySelectorAll('section')) {
    const c = document.createElement('canvas'); s.prepend(c);
    if (s.dataset.o) c.style.opacity = s.dataset.o;
    const fragment = await (await fetch('shaders/' + s.dataset.shader)).text();
    new MuushGradient(c, { fragment, uniforms: JSON.parse(s.dataset.u) });
  }
</script>
</body></html>
