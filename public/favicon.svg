<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <title>muush</title>
  <!--
    The muush isotipo (lockup C — isotipo only), as the site's one and only
    icon. Geometry from app/assets/logo/README.md and docs/business/branding.md
    § Isotipo; the three brand SVGs in app/assets/logo/ carry exactly the same
    circle, path, stroke-width and linecap.

    ## Why a 0 0 100 100 viewBox and a translate

    The brand artboard is 70.5 × 39.5 (`viewBox="14.5 38.5 70.5 39.5"`), and a
    favicon is square. Stretching a 70.5 × 39.5 artboard to fill a square is
    the failure this framing exists to avoid, so the mark is *placed* in a
    square instead of scaled into one. The framing is not invented here:
    branding.md § Isotipo already records it as "viewBox avatar/favicon:
    0 0 100 100 con transform translate(3,-8)".

    Check, with stroke-width 12 (the stroke extends 6 either side of the path):
    the art spans x 15→85 and y 38.5→78; after translate(3, -8) that is
    x 18→88 and y 30.5→70 inside a 100 × 100 box — centred to within half a
    unit, undistorted, with the round terminals intact.

    ## Why literal hex is correct in this file, and only in this file

    A standalone document in public/ is outside the app's CSS and cannot read a
    custom property, which is why the three brand SVGs in app/assets/logo/
    carry literals too. Since feature 43 the values are the Muush 1.0
    palette's (`docs/business/muush-1.0.md` § 2, `global.css`): Negro 950
    #050505, Blanco #F4F4F2 and Red muush 500 #E5352F. Roberto, 2026-11-01:
    the dot is Red muush 500 and the adaptive stroke moves to the v2
    neutrals; the geometry and framing do not change. No v1 value remains.

    ## Why the light scheme is the default rather than a media query branch

    Support for prefers-color-scheme inside an SVG favicon varies, and Safari
    does not use SVG favicons at all. Making the light-chrome colours the
    unconditional declaration means a browser that ignores the query still
    renders a correct, legible mark rather than nothing or the wrong one
    (spec A-08): Negro 950 on light browser chrome, Blanco on dark. The dot
    is Red muush 500 in both schemes.
  -->
  <style>
    .stroke { stroke: #050505; }
    @media (prefers-color-scheme: dark) {
      .stroke { stroke: #F4F4F2; }
    }
  </style>
  <g transform="translate(3, -8)">
    <circle cx="21" cy="45" r="6.5" fill="#E5352F" />
    <path
      class="stroke"
      stroke-linecap="round"
      stroke-width="12"
      d="M21 72a17 17 0 0 1 34 0 12 12 0 0 1 24 0"
    />
  </g>
</svg>
